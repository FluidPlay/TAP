  <script>
    function runWithCallback(method, ...params) { 
       var promise = new Promise((resolve, failure) => {
         google.script.run
           .withSuccessHandler((...args) => { resolve(...args) })
           .withFailureHandler((...args) => { failure(...args) })[method](...params)
       })
       return promise
    }
  
    window.onload = function() {
      // Fields and Buttons
      const multiplierField = document.getElementById('multFieldId')
      const tableField = document.getElementById('tableFieldId')
      const applyButton = document.getElementById('applyButtonId')
      const updateSelBtn = document.getElementById('updateSelBtnId')
      const inTableBtn = document.getElementById('inTableBtnId')
      const outTableBtn = document.getElementById('outTableBtnId')
      const showColumnsField = document.getElementById('showColumnsFieldId')
      const showColumnsBtn = document.getElementById('showColumnsBtnId')
      const updateRefBtn = document.getElementById('updatedRefBtnId')
      const exportDataBtn = document.getElementById('exportDataBtnId')
      const exportIconTypesBtn = document.getElementById('exportIconTypesBtnId')

      // Labels and Divs
      const selectionOutLbl = document.getElementById('selectionOutId')   
      const outputDiv = document.getElementById('outputDivId')
      
      // Button Callbacks
      updateRefBtn.onclick = function() {
        runWithCallback('updateReferences')
      }
      
      exportDataBtn.onclick = function() {
//        tableField.value = "Processing.."
        runWithCallback('getExportData')
        .then ( (value) => { tableField.value = value } )        
      }
      
      exportIconTypesBtn.onclick = function() {
        runWithCallback('exportIconTypes')
      }
      
      applyButton.onclick = function() {
        var multiplier = multiplierField.value
        runWithCallback('multiplyValues', multiplier)
        .then( (value) => { outputDiv.innerHTML = 'Callback Result: ' + value } )
      }
                          
      updateSelBtn.onclick = function() {
            runWithCallback('getSelectedRangeA1', null)
            .then( (value) => { selectionOutLbl.value = value } )
      }
      
      inTableBtn.onclick = function() {
        runWithCallback('getTableFromSheet', null)
        .then ( (value) => { tableField.value = value } )
      }
      
      outTableBtn.onclick = function() {
        runWithCallback('putTableToSheet', tableField.value)
        //.then ( (value) => { tableField.value = value } )        
      }
      
      showColumnsBtn.onclick = function() {
          runWithCallback('showColumns', showColumnsField.value)
      }

  }
